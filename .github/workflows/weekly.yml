name: OFFISCAN
on:
  schedule:
    - cron: "17 21 * * *"
    - cron: "23 22 * * 0"
    - cron: "53 22 * * 0"
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      job:
        description: "수동 실행할 작업"
        type: choice
        options: [news, indu, client, weekly]
        default: news
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: keys
        run: |
          cat > keys.txt <<'EOF'
          DATA_GO_KR_KEY=${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_ACCESS_TOKEN=
          KAKAO_REST_KEY=${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
          KAKAO_REFRESH_TOKEN=${{ secrets.KAKAO_REFRESH_TOKEN }}
          NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
          EOF
      - name: news
        if: github.event.schedule == '17 21 * * *' || inputs.job == 'news'
        run: python news_report.py
      - name: indu
        if: github.event.schedule == '23 22 * * 0' || inputs.job == 'indu'
        run: python indu_report.py
      - name: client
        if: github.event.schedule == '53 22 * * 0' || inputs.job == 'client'
        run: python client_digest.py send
      - name: weekly
        if: github.event.schedule == '0 21 * * 0' || inputs.job == 'weekly'
        run: python weekly_digest.py
      - name: save
        if: always()
        run: |
          mkdir -p reports
          mv -f indu_detail_*.csv indu_report_*.txt news_*.txt client_*.txt weekly_kakao_*.txt reports/ 2>/dev/null || true
          git config user.name "offiscan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f indu_master.csv news_master.csv reports/ docs/ || true
          git diff --staged --quiet || git commit -m "run $(date +%F)"
          git push || true
